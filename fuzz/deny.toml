# cargo-deny policy for the fuzz workspace: run with `cargo xtask tool cargo-deny --manifest-path
# fuzz/Cargo.toml --config fuzz/deny.toml --locked check`. The same policy as the main workspace's
# deny.toml, over fuzz/Cargo.lock; only the licences, the licence exception and the skips differ,
# because cargo-deny fails on any it does not encounter.

[graph]
# The platforms abc is fuzzed on; dependencies only other platforms pull in are not checked.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
# Every ignore is a table with a `reason` that names the date it expires, and is removed by then:
# { id = "RUSTSEC-YYYY-NNNN", reason = "why it does not affect abc; expires YYYY-MM-DD" }
ignore = []

[licenses]
# The approved licences that deny.toml lists, as far as this graph uses them; an unused entry fails
# the check.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
]
unused-allowed-license = "deny"
# libFuzzer's C++ sources, which libfuzzer-sys compiles in, are LLVM's and carry NCSA. Allowed only
# for that crate: the fuzz binary is built to fuzz with and never shipped.
exceptions = [
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies on the main workspace's crates carry no version; every crate here is
# unpublished.
allow-wildcard-paths = true
deny = [
    { crate = "openssl-sys", reason = "abc uses rustls; OpenSSL drags in a system C library", use-instead = "rustls" },
]
# Every skip names the crates holding the old version back:
# { crate = "name@version", reason = "held back by ...; drop when ..." }
skip = [
    { crate = "syn@2", reason = "held back by proc-macro crates on syn 2 (ts-rs-macros, zeroize_derive); drop when they move to syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
