# cargo-deny policy: run with `cargo xtask tool cargo-deny check`.

[graph]
# The platforms abc ships for; dependencies only other platforms pull in are not checked.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
# Every ignore is a table with a `reason` that names the date it expires, and is removed by then:
# { id = "RUSTSEC-YYYY-NNNN", reason = "why it does not affect abc; expires YYYY-MM-DD" }
ignore = []

[licenses]
# Approved licences: MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause, BSD-3-Clause,
# ISC, Zlib, 0BSD, BSL-1.0, Unicode-3.0, CC0-1.0, CDLA-Permissive-2.0 and MPL-2.0. `allow` lists
# only those the dependency graph uses, because an unused entry fails the check; add an approved
# licence here when a dependency first brings it in. Any other licence needs a decision first.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
unused-allowed-license = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies between workspace crates carry no version; every crate here is unpublished.
allow-wildcard-paths = true
deny = [
    { crate = "openssl-sys", reason = "abc uses rustls; OpenSSL drags in a system C library", use-instead = "rustls" },
]
# Every skip names the crates holding the old version back:
# { crate = "name@version", reason = "held back by ...; drop when ..." }
skip = [
    # Added 2026-11-01 with abc-core and abc-protocol (S0 PR 3); review at each bump of their holders.
    { crate = "syn@2", reason = "held back by proc-macro crates on syn 2 (ts-rs-macros, zeroize_derive, sqlx-macros, tracing-attributes); drop when they move to syn 3" },
    { crate = "getrandom@0.2", reason = "held back by ring, through rustls and xtask; drop when ring moves to getrandom 0.4" },
    # Added 2026-11-01 with sqlx 0.9.0 (S0 PR 3); review at each sqlx bump.
    { crate = "sha2@0.10", reason = "held back by sqlx-core (SCRAM auth); drop when sqlx moves to sha2 0.11" },
    { crate = "digest@0.10", reason = "held back by sha2 0.10, through sqlx-core; drop with sha2@0.10" },
    { crate = "block-buffer@0.10", reason = "held back by sha2 0.10, through sqlx-core; drop with sha2@0.10" },
    { crate = "crypto-common@0.1", reason = "held back by sha2 0.10, through sqlx-core; drop with sha2@0.10" },
    { crate = "cpufeatures@0.2", reason = "held back by sha2 0.10, through sqlx-core; drop with sha2@0.10" },
    { crate = "base64@0.22", reason = "held back by sqlx-core and sqlx-postgres; drop when sqlx moves to base64 0.23" },
    { crate = "hashlink@0.11", reason = "held back by sqlx-core; drop when sqlx moves to hashlink 0.12" },
    { crate = "hashbrown@0.16", reason = "held back by sqlx-core and hashlink 0.11; drop with hashlink@0.11" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
