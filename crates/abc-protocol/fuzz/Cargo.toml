[package]
name = "abc-fuzz"
description = "Fuzz targets for abc's wire formats, run with `cargo xtask fuzz`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
abc-protocol = { path = ".." }
libfuzzer-sys = { workspace = true }

# Decodes untrusted bytes as every message either side reads, and checks that anything accepted
# survives an encode and a decode unchanged.
[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[lints]
workspace = true
