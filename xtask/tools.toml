# Tools that xtask installs into .tools/ and runs from there, never from PATH.
#
# `cargo xtask setup` downloads each tool's release archive for this machine, checks its sha256,
# and installs the binary at .tools/<name>/<version>/<name>. `cargo xtask doctor` fails when a
# tool is missing or reports another version. After changing a version, run `cargo xtask pin` to
# record the new archives' checksums for every target.
#
# `url` and `binary` (the executable's path inside the archive) are templates: {version} is the
# tool's version and {platform} is the target's name in the project's asset file names.
# Renovate bumps `version` from the GitHub release named in the `url` line right after it, so
# keep `version` and `url` adjacent and in that order.

[[tool]]
name = "cargo-nextest"
version = "0.9.150"
url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-{version}/cargo-nextest-{version}-{platform}.tar.gz"
binary = "cargo-nextest"
targets.aarch64-apple-darwin = { platform = "universal-apple-darwin", sha256 = "82a759b4d218d38359424196ab244c470e8f7c7d149c814fbbeef4d67c3c301a" }
targets.x86_64-unknown-linux-gnu = { platform = "x86_64-unknown-linux-gnu", sha256 = "b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f" }
targets.aarch64-unknown-linux-gnu = { platform = "aarch64-unknown-linux-gnu", sha256 = "9164568e9840c6509177086828ac7d3178c2d8feb0658b4d2bff62fa620e98c8" }

