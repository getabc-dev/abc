# Tools that xtask installs into .tools/ and runs from there, never from PATH.
#
# `cargo xtask setup` downloads each tool's release archive for this machine, checks its sha256,
# and installs the executable at .tools/<name>/<version>/<name> once its own sha256 matches
# `binary-sha256`. xtask checks that sha256 again whenever it runs the tool, and
# `cargo xtask doctor` fails when a tool is missing, modified or reports another version. After
# changing a version, run `cargo xtask pin` to record the new checksums for every target.
#
# `url`, `binary` (the executable's path inside a .tar.gz archive; omitted when the asset is the
# executable itself) and `checksums` are templates:
# {version} is the tool's version and {platform} is the target's name in the project's asset file
# names. `checksums` is where the project publishes its assets' sha256, and `attestations` the
# GitHub repository whose build attestations list them; `cargo xtask pin` refuses a download that
# either does not vouch for, and every tool needs at least one, so no pin rests on its first
# download. zizmor and cargo-shear publish no checksums but attest their release archives.
# Renovate bumps `version` from the GitHub release named in the `url` line right after it, so
# keep `version` and `url` adjacent and in that order.

[[tool]]
name = "cargo-nextest"
version = "0.9.150"
url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-{version}/cargo-nextest-{version}-{platform}.tar.gz"
binary = "cargo-nextest"
checksums = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-{version}/cargo-nextest-{version}-{platform}.sha256"
targets.aarch64-apple-darwin = { platform = "universal-apple-darwin", sha256 = "82a759b4d218d38359424196ab244c470e8f7c7d149c814fbbeef4d67c3c301a", binary-sha256 = "aad9d409cd2f0a81fcaed49d7672a133254179458436c1e957505e4a11655329" }
targets.x86_64-unknown-linux-gnu = { platform = "x86_64-unknown-linux-gnu", sha256 = "b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f", binary-sha256 = "62dcc4348e189f5fbd5881f6b753c59d62f2e664b28c6357898644288d703c02" }
targets.aarch64-unknown-linux-gnu = { platform = "aarch64-unknown-linux-gnu", sha256 = "9164568e9840c6509177086828ac7d3178c2d8feb0658b4d2bff62fa620e98c8", binary-sha256 = "5f9b5ea1599590cbbe1e3487746af3d707ab0c52a5aba784c0b139d39a7aa51b" }

