# Tools that xtask installs into .tools/ and runs from there, never from PATH.
#
# `cargo xtask setup` downloads each tool's release archive for this machine, checks its sha256,
# and installs the executable at .tools/<name>/<version>/<name> once its own sha256 matches
# `binary-sha256`. xtask checks that sha256 again whenever it runs the tool, and
# `cargo xtask doctor` fails when a tool is missing, modified or reports another version. After
# changing a version, run `cargo xtask pin` to record the new checksums for every target.
#
# `url`, `binary` (the executable's path inside a .tar.gz archive; omitted when the asset is the
# executable itself), a target's `library`, `checksums` and `release-digests` are templates:
# {version} is the tool's version and {platform} is the target's name in the project's asset file
# names. `checksums` is where the project publishes its assets' sha256, and `attestations` the
# GitHub repository whose build attestations list them; `release-digests` is the GitHub API's
# view of the release, whose asset digests GitHub recorded as each asset was uploaded.
# `cargo xtask pin` refuses a download that any of them does not vouch for, and every tool needs
# at least one, so no pin rests on its first download. zizmor and cargo-shear publish no checksums
# but attest their release archives; shellcheck does neither, so it rests on GitHub's digests.
# A target's `library` names a shared library in the archive that the executable loads from beside
# itself; `cargo xtask setup` installs it there once its sha256 matches `library-sha256`, and xtask
# checks that sha256 as it checks the executable's.
# `tree = true` installs the whole archive as the tool's directory, for a tool that loads files
# beside its executable at run time, as pnpm loads its dist/. `binary` is then the executable's
# path in that directory, and a target's `tree-sha256` pins the directory: the sha256 of its
# manifest, a line per file with the file's sha256, whether it is executable and its path.
# `cargo xtask setup` refuses an archive holding anything but files and directories, and xtask
# checks every installed file against that pin whenever it runs the tool.
# Renovate bumps `version` from the GitHub release named in the `url` line right after it, so
# keep `version` and `url` adjacent and in that order.
#
# A tool with no verifiable release build is built from crates.io instead: `crate` names the
# crate and `sha256` pins its .crate file, which `cargo xtask pin` checks against the crates.io
# index. `cargo xtask setup` builds it with `cargo install --locked` and records the executable's
# sha256 beside it, which xtask checks whenever it runs the tool. `features`, when given, replaces
# the crate's default features. Renovate bumps `version` from crates.io; keep `version` before
# `crate`, with only comments between them.
#
# `for-tests = true` marks a tool the tests run. `cargo xtask setup --for-tests` installs exactly
# those, and every CI job that runs tests uses it; `cargo xtask rulesets check` fails a job that
# runs `check`, `coverage` or `mutants` without it, and a test that runs a pinned tool not marked
# so fails.

[[tool]]
name = "cargo-nextest"
for-tests = true
version = "0.9.150"
url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-{version}/cargo-nextest-{version}-{platform}.tar.gz"
binary = "cargo-nextest"
checksums = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-{version}/cargo-nextest-{version}-{platform}.sha256"
targets.aarch64-apple-darwin = { platform = "universal-apple-darwin", sha256 = "82a759b4d218d38359424196ab244c470e8f7c7d149c814fbbeef4d67c3c301a", binary-sha256 = "aad9d409cd2f0a81fcaed49d7672a133254179458436c1e957505e4a11655329" }
targets.x86_64-unknown-linux-gnu = { platform = "x86_64-unknown-linux-gnu", sha256 = "b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f", binary-sha256 = "62dcc4348e189f5fbd5881f6b753c59d62f2e664b28c6357898644288d703c02" }
targets.aarch64-unknown-linux-gnu = { platform = "aarch64-unknown-linux-gnu", sha256 = "9164568e9840c6509177086828ac7d3178c2d8feb0658b4d2bff62fa620e98c8", binary-sha256 = "5f9b5ea1599590cbbe1e3487746af3d707ab0c52a5aba784c0b139d39a7aa51b" }

