[profile.default]
# A flaky test is a bug to fix, never something to retry.
retries = 0
# Report every failing test in one run.
fail-fast = false
# A test still running after two minutes is hung: stop it and fail.
slow-timeout = { period = "30s", terminate-after = 4 }

# A JUnit report of every run, at target/nextest/default/junit.xml: check, coverage and mutants
# read it to annotate each failing test with its panic in GitHub Actions (xtask/src/junit.rs).
[profile.default.junit]
path = "junit.xml"

# The opt-in Tailscale passthrough check waits for two nodes to join a tailnet and for Serve's first
# certificate, which takes minutes.
[[profile.default.overrides]]
filter = "test(serve_passes_identity_websockets_and_unbuffered_sse_to_the_unix_socket)"
slow-timeout = { period = "60s", terminate-after = 10 }

# Builds xtask from a copy of the repository, from scratch the first time.
[[profile.default.overrides]]
filter = "test(the_hooks_answer_when_the_main_workspace_does_not_resolve)"
slow-timeout = { period = "60s", terminate-after = 10 }
