[profile.default]
# A flaky test is a bug to fix, never something to retry.
retries = 0
# Report every failing test in one run.
fail-fast = false
# A test still running after two minutes is hung: stop it and fail.
slow-timeout = { period = "30s", terminate-after = 4 }

# A JUnit report of every run, at target/nextest/default/junit.xml: check, coverage and mutants
# read it to annotate each failing test with its panic in GitHub Actions (xtask/src/junit.rs).
[profile.default.junit]
path = "junit.xml"

# The opt-in real-tailnet check runs abc server setup, which waits for abc's node to join the
# tailnet, and then for Serve's first certificate, which takes minutes.
[[profile.default.overrides]]
filter = "test(abc_server_setup_serves_the_real_binaries_through_tailscale)"
slow-timeout = { period = "60s", terminate-after = 10 }

# Build xtask from a copy of the repository, from scratch the first time: more than two minutes
# on a loaded agent VM, where the default limit failed the coverage and mutants baselines.
[[profile.default.overrides]]
filter = "test(the_hooks_answer_when_the_main_workspace_does_not_resolve) | test(the_stop_hook_never_starts_check_beside_another_gate)"
slow-timeout = { period = "60s", terminate-after = 10 }

# The specs' gate tests each start a JVM for Apalache's server, and TLC another: one at a time, so
# that they fit in an agent VM's memory beside the rest of the tests.
[test-groups]
jvm = { max-threads = 1 }

[[profile.default.overrides]]
filter = "test(/^spec::tests::/) | test(the_specs_gate_runs_when_specs_or_pins_change)"
test-group = "jvm"
