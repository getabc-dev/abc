[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Crates that `cargo xtask setup` builds into .tools/ are never part of the workspace.
exclude = [".tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Equal to the toolchain pinned in rust-toolchain.toml; an xtask test keeps them in step.
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/getabc-dev/abc"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws", "matched-path", "tracing"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
flate2 = "1.1.10"
futures = "0.3.34"
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-util = { version = "0.1.21", features = ["tokio"] }
insta = "1.49.0"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rand = { version = "0.10.3", default-features = false, features = ["sys_rng", "std"] }
# The worker test harness's TLS certificates, made at run time: a committed private key would be a
# leaked secret to gitleaks, and a committed certificate would expire.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
schemars = { version = "1.2.3", features = ["uuid1", "semver1"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
ring = "0.17.14"
# getuid and uname for the worker, with no unsafe code of our own.
rustix = "1.1.6"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# The worker's certificate verification: what the operating system trusts (decision W4).
rustls-platform-verifier = "0.7.1"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "time", "json"] }
subtle = "2.6.1"
syn = { version = "3.0.9", features = ["full", "visit"] }
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1.19"
tokio-tungstenite = "0.30.0"
yaml-rust2 = "0.13.0"
toml_edit = { version = "0.25.17", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "fmt"] }
ts-rs = { version = "12.0.1", features = ["uuid-impl", "semver-impl", "serde-compat", "no-serde-warnings"] }
ureq = "3.5.0"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
zeroize = { version = "1.9.1", features = ["derive"] }

# xtask hashes every pinned tool before running it; optimise sha2 so debug builds hash quickly.
[profile.dev.package.sha2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Selected nursery lints.
use_self = "deny"
redundant_clone = "deny"
significant_drop_in_scrutinee = "deny"
needless_collect = "deny"
or_fun_call = "deny"
# Restriction lints: no panics, unchecked arithmetic, lossy casts, silent errors or catch-all matches.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
missing_assert_message = "deny"
exit = "deny"
mem_forget = "deny"
wildcard_enum_match_arm = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
clone_on_ref_ptr = "deny"
error_impl_error = "deny"
map_err_ignore = "deny"
unused_result_ok = "deny"
assertions_on_result_states = "deny"
tests_outside_test_module = "deny"
cfg_not_test = "deny"
iter_over_hash_type = "deny"
shadow_unrelated = "deny"
try_err = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
self_named_module_files = "deny"
