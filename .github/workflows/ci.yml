name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, clippy and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # Database tests run against Postgres 18 on the port .cargo/config.toml's DATABASE_URL names,
    # the same image as each machine's warm container (xtask/src/postgres.rs).
    services:
      postgres:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the pinned tools
        run: cargo xtask setup cargo-nextest cargo-sqlx
      - name: Check the installed tools against their pins
        run: cargo xtask doctor cargo-nextest cargo-sqlx
      - name: Format, clippy, tests, query caches, doctests and docs
        run: cargo xtask check

  dependencies:
    name: Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the pinned tools
        run: cargo xtask setup cargo-deny cargo-shear osv-scanner
      - name: Check the installed tools against their pins
        run: cargo xtask doctor cargo-deny cargo-shear osv-scanner
      - name: Advisories, licences, bans and sources
        run: cargo xtask tool cargo-deny check
      - name: Unused dependencies
        run: cargo xtask tool cargo-shear --deny-warnings --locked
      - name: Known vulnerabilities (OSV)
        run: cargo xtask tool osv-scanner scan source --lockfile Cargo.lock

  scans:
    name: Secrets and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the whole history, not only the tip.
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the pinned tools
        run: cargo xtask setup zizmor pinact gitleaks
      - name: Check the installed tools against their pins
        run: cargo xtask doctor zizmor pinact gitleaks
      - name: Workflow security
        run: cargo xtask tool zizmor --pedantic .github
        env:
          # Read-only token for zizmor's online audits, such as impostor commits.
          GH_TOKEN: ${{ github.token }}
      - name: Actions pinned to full commit SHAs
        run: cargo xtask tool pinact run --check --verify-comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Secrets in the git history
        run: cargo xtask tool gitleaks git --redact --no-banner --verbose .

  # The gates below run the base commit's xtask on the pull request's tree (--root), so a pull
  # request cannot change the gates that judge it. Its tests still run, and use its own pinned
  # cargo-nextest; no secret is in reach.
  coverage:
    name: Coverage
    # Required on pull requests and in the merge queue; a push to main was already gated.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    # Database tests run against Postgres 18 on the port .cargo/config.toml's DATABASE_URL names,
    # the same image as each machine's warm container (xtask/src/postgres.rs).
    services:
      postgres:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/base-xtask
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          gate: coverage
          tools: cargo-nextest cargo-llvm-cov
      - name: Install the pull request's Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the pinned cargo-nextest the pull request's tests use
        run: cargo xtask setup cargo-nextest
      - name: 90% of changed lines covered
        working-directory: ${{ runner.temp }}/base
        run: cargo xtask coverage --root "$GITHUB_WORKSPACE" --base "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}

  mutants-shard:
    name: Mutants shard ${{ matrix.shard }}/8
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    # Eight shards keep each well inside the merge queue's 150-minute check timeout.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    # Database tests run against Postgres 18 on the port .cargo/config.toml's DATABASE_URL names,
    # the same image as each machine's warm container (xtask/src/postgres.rs).
    services:
      postgres:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/base-xtask
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          gate: mutants
          tools: cargo-nextest cargo-mutants
      - name: Install the pull request's Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the pinned cargo-nextest the pull request's tests use
        run: cargo xtask setup cargo-nextest
      - name: No missed mutants in this shard of the changed code
        working-directory: ${{ runner.temp }}/base
        run: cargo xtask mutants --root "$GITHUB_WORKSPACE" --base "$BASE" --jobs 2 --shard "$SHARD/8"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          SHARD: ${{ matrix.shard }}

  mutants:
    name: Mutants
    # Reports for every shard, as the one required check; it fails unless all of them passed.
    if: always() && github.event_name != 'push'
    needs: mutants-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every shard caught every mutant
        run: |
          echo "mutant shards: $RESULT"
          [ "$RESULT" = success ]
        env:
          RESULT: ${{ needs.mutants-shard.result }}
