name: Tailscale

# The real Tailscale checks, both with the tailscale/tailscale image pinned in .github/tailscale-image:
# the passthrough check (crates/abc-server/tests/tailscale.rs), Serve in front of the sidecar socket
# reached from a second node; and the real-app check (crates/abc/tests/tailscale.rs, decision 39),
# the real `abc server`, `abc worker enrol` and `abc worker` binaries through Serve, from the runner
# joined to the tailnet as an ephemeral node of its own. They need a tailnet auth key,
# so it runs only on a pull request a maintainer labels `tailscale-check`, and again on each push
# while the label stays. Only someone with triage access can add the label, and pull requests from
# forks receive no secrets, so the job fails there instead of skipping. The job runs in the
# `tailscale` environment: a maintainer can require approval for every run there, so no pushed code
# reaches the key unseen. Neither is a required check, so they never block the merge queue.

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  passthrough:
    name: Tailscale passthrough
    if: contains(github.event.pull_request.labels.*.name, 'tailscale-check')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: tailscale
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # xtask is a workspace of its own, built into the root's target/ (.cargo/config.toml).
          workspaces: |
            . -> target
            xtask -> ../target
      - name: Install the pinned tools
        run: cargo xtask setup cargo-nextest
      - name: Check the installed tools against their pins
        run: cargo xtask doctor cargo-nextest
      - name: Tailscale passthrough check
        run: >-
          cargo xtask tool cargo-nextest nextest run --locked -p abc-server --run-ignored only
          -E 'test(serve_passes_identity_websockets_and_unbuffered_sse_to_the_unix_socket)'
        env:
          ABC_TAILSCALE_AUTHKEY: ${{ secrets.ABC_TAILSCALE_AUTHKEY }}
          ABC_TAILSCALE_TAILNET: ${{ secrets.ABC_TAILSCALE_TAILNET }}

  real-app:
    name: Tailscale real app
    if: contains(github.event.pull_request.labels.*.name, 'tailscale-check')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: tailscale
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # xtask is a workspace of its own, built into the root's target/ (.cargo/config.toml).
          workspaces: |
            . -> target
            xtask -> ../target
      - name: Install the pinned tools
        run: cargo xtask setup cargo-nextest node pnpm
      - name: Check the installed tools against their pins
        run: cargo xtask doctor cargo-nextest node pnpm
      # The abc binary embeds the built web app (crates/abc/build.rs).
      - name: Build the web app the binary embeds
        run: |
          cargo xtask pnpm install --frozen-lockfile
          cargo xtask pnpm run build
      - name: Build the test first, so the node is not left waiting
        run: cargo xtask tool cargo-nextest nextest list --locked -p abc --run-ignored only
      # The runner joins as a node in kernel mode, as a worker's machine does: tailscale0 in the
      # runner's own network namespace, and systemd-resolved asking MagicDNS for the tailnet's names.
      - name: Join the runner to the tailnet
        run: |
          image=$(cat .github/tailscale-image)
          docker run --detach --name abc-runner-node --network host \
            --cap-add NET_ADMIN --cap-add NET_RAW --device /dev/net/tun \
            --env TS_AUTHKEY --env TS_HOSTNAME="abc-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --env TS_USERSPACE=false --env TS_ACCEPT_DNS=false "$image"
          # Only the state is read, never printed: `tailscale status` lists the tailnet's peers
          # in a public log.
          running() {
            docker exec abc-runner-node tailscale status --json 2>/dev/null |
              jq -e '.BackendState == "Running"' >/dev/null
          }
          for _ in $(seq 60); do
            if running; then break; fi
            sleep 2
          done
          running || { echo "the runner did not join the tailnet" >&2; exit 1; }
          sudo resolvectl dns tailscale0 100.100.100.100
          sudo resolvectl domain tailscale0 "~${ABC_TAILSCALE_TAILNET}"
        env:
          TS_AUTHKEY: ${{ secrets.ABC_TAILSCALE_AUTHKEY }}
          ABC_TAILSCALE_TAILNET: ${{ secrets.ABC_TAILSCALE_TAILNET }}
      - name: Tailscale real-app check
        run: >-
          cargo xtask tool cargo-nextest nextest run --locked -p abc --run-ignored only
          -E 'test(the_real_binaries_connect_through_tailscale_serve)'
        env:
          ABC_TAILSCALE_AUTHKEY: ${{ secrets.ABC_TAILSCALE_AUTHKEY }}
          ABC_TAILSCALE_TAILNET: ${{ secrets.ABC_TAILSCALE_TAILNET }}
      - name: Leave the tailnet
        if: always()
        run: |
          docker exec abc-runner-node tailscale logout || true
          docker rm -f abc-runner-node || true
