name: Integrity approval

on:
  pull_request:
    types: [synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  remove-stale-approval:
    name: Remove a stale integrity approval
    # A fork's token cannot edit labels; its approval is checked against the push time anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # remove the integrity-approved label after a push
    steps:
      - name: A new push needs a new approval
        run: |
          if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx integrity-approved; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/integrity-approved"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
