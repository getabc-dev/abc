name: Integrity approval

on:
  pull_request:
    # The label approves the head commit and the reasons in the description, so a new push or an
    # edited description needs a new approval.
    types: [synchronize, edited]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  remove-stale-approval:
    name: Remove a stale integrity approval
    # A fork's token cannot edit labels; its approval is checked against the push time anyway.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action == 'synchronize' || github.event.changes.body != null)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # remove the integrity-approved label after a push or description edit
    steps:
      - name: A new push or description needs a new approval
        run: |
          if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx integrity-approved; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/integrity-approved"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
