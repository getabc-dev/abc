name: Fuzz

# Lints the fuzz workspace (fuzz/, its own Cargo workspace) and fuzzes protocol message decoding
# with it (`cargo xtask fuzz`, target `decode`): for a minute on every pull request and in the merge
# queue, where it is a required check, and for an hour every night on main. A failure prints the
# failing input in the job log (libFuzzer's `Base64:` line); add it to fuzz/seeds/decode once fixed,
# so every run replays it.

on:
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  decode:
    name: Fuzz protocol decoding
    runs-on: ubuntu-26.04
    # The nightly hour, plus building the target and cargo-fuzz.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # xtask and the fuzz target are workspaces of their own, both built into the root's target/
          # (.cargo/config.toml).
          workspaces: |
            xtask -> ../target
            fuzz -> ../target
      - name: Install the pinned tools
        run: cargo xtask setup cargo-fuzz
      - name: Check the installed tools against their pins
        run: cargo xtask doctor cargo-fuzz
      - name: Lint the fuzz workspace and fuzz decoding
        run: cargo xtask fuzz --seconds "$SECONDS_TO_FUZZ"
        env:
          SECONDS_TO_FUZZ: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '3600' || '60' }}
