name: Review

on:
  pull_request:
    # An edited description re-reviews the reasons it gives for test changes.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gemini:
    name: Gemini review
    # Drafts are skipped; marking one ready for review runs it.
    if: github.event_name == 'merge_group' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Gemini reviews the diff against AGENTS.md
        run: cargo xtask review --base "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
